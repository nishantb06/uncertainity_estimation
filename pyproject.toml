[project]
name = "uncertainity-estimation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "torchvision",
  "einops",
  "easydict",
  "safetensors",
  "tqdm>=4.70.0",
  "pdf2image>=1.17.0",
  "pillow>=12.3.0",
  "lightning>=2.6.0",
  "tensorboard>=2.21.0",
  "pyyaml>=6.0",
  "rich>=13.0.0",
  "pandas>=2.2.0",
  "matplotlib>=3.8.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
