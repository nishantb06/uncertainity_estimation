run:
  alias: ceiling_full_sam_clip_freeze

data:
  dataset_path: /mnt/data/uncertainity_estimation/docile/data/docile
  holdout_path: /mnt/data/uncertainity_estimation/splits/holdout_180.json
  train_pool_path: /mnt/data/uncertainity_estimation/splits/train_pool.json
  train_mode: ceiling
  sampled_documents_csv: null
  image_size: 640
  page: 0
  batch_size: 16
  num_workers: 4
  class_list:
    - credit_note
    - order
    - proforma
    - purchase_order
    - receipt
    - sales_order
    - tax_invoice
  excluded_classes:
    - debit_note
    - utility_bill

model:
  checkpoint: /mnt/data/DeepSeek-OCR/model-00001-of-000001.safetensors
  n_embed: 1280
  mlp_hidden_dims: [2048, 1024, 512, 32]
  mlp_dropout: 0.1
  num_classes: 7
  train_from_zero:
    SAM: false
    CLIP: false
  freeze:
    SAM: true
    CLIP: true

training:
  max_lr: 1.0e-3
  warmup_steps: 100
  max_steps: 5000
  effective_batch_size: 32
  grad_clip: 1.0
  val_every_n_steps: 100
  log_every_n_steps: 10
  save_checkpoints_every_n_steps: 500
  precision: bf16-mixed
  seed: 42
  compile: true
  logs_root: /mnt/data/logs
  checkpoints_root: /mnt/data/checkpoints
  replace_existing_logs: true
